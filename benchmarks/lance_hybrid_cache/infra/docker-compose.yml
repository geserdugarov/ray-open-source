name: lance_hybrid_cache

services:
  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:latest}
    container_name: lance-bench-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_BIND_ADDR:-127.0.0.1}:9000:9000"
      - "${MINIO_BIND_ADDR:-127.0.0.1}:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  minio-data:
